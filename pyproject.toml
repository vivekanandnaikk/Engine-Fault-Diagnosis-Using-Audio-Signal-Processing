[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engine-dsp"
version = "0.1.0"
description = "Exploratory DSP feature comparison for motorcycle engine audio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "librosa>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
engine-dsp = "engine_dsp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
